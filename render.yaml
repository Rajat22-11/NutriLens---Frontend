# Render Blueprint for the NutriLens web app.
# Every push to `main` rebuilds and redeploys automatically.
services:
  - type: web
    runtime: static
    name: NutriLens---Frontend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL of the NutriLens API
      - key: VITE_API_URL
        value: https://nutrilens-backend-aet6.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA fallback so deep links like /dashboard work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
