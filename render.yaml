# Render Blueprint for the NutriLens web app (v2).
# Connect once via Render Dashboard -> New -> Blueprint -> this repo, branch `claude/stoic-rubin-im3nuc`.
# After that every push to that branch rebuilds and redeploys automatically.
services:
  - type: web
    runtime: static
    name: nutrilens-web-v2
    branch: claude/stoic-rubin-im3nuc
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL of the backend service created by the NutriLens---Backend blueprint
      - key: VITE_API_URL
        value: https://nutrilens-api-v2.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA fallback so deep links like /dashboard work on refresh
      - type: rewrite
        source: /*
        destination: /index.html
